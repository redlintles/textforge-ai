[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textforge-ai"
version = "0.1.0"
description = "Generate TextForge pipelines from English instructions"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = ["textforgers==0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
train = ["torch>=2.2", "transformers>=4.40,<5", "tokenizers>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
